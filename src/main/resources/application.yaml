server:
  port: 8081

spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/java-dly?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis 配置（用于会话存储、记忆等）
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000

  # AI 配置（切换到 DeepSeek）
  ai:
    # OpenAI 兼容接口（DeepSeek 兼容 OpenAI API）
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          top-p: 0.1
# 角色头像上传目录（运行时创建，URL /avatars/** 映射到该目录）
role:
  avatar:
    upload-dir: ./upload/avatars

# 日志级别（用于调试 SQL）
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE