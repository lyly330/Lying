<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/css/document/document.css}" rel="stylesheet">
</head>
<body>
<div th:fragment="content">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-8">
                <div class="upload-section" id="uploadSection">
                    <h5>知识小屋文档</h5>
                    <p class="text-muted">把资料拖进来，或点击选择文件。上传后会存入数据库，之后可以继续调用。</p>
                    <input type="file" id="fileInput" style="display: none" onchange="handleFileSelect(this)" multiple>
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-plus-circle"></i> 选择文件
                    </button>
                </div>
                <div class="file-list mt-4" id="fileList"></div>
                <div class="mt-3 d-flex justify-content-between">
                    <button id="clearAllBtn" class="btn btn-outline-danger" onclick="clearAllFiles()" style="display: none;">
                        <i class="bi bi-trash"></i> 清除全部
                    </button>
                    <button id="uploadAllBtn" class="btn btn-primary" onclick="uploadAllFiles()">
                        <i class="bi bi-cloud-upload"></i> 开始上传
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">上传说明</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled upload-tips">
                            <li><i class="bi bi-check-circle"></i> 支持 PDF、Word、TXT</li>
                            <li><i class="bi bi-check-circle"></i> 单个文件最大 10MB</li>
                            <li><i class="bi bi-check-circle"></i> 上传内容会进入知识库和数据库</li>
                            <li><i class="bi bi-check-circle"></i> 后续可通过接口继续调用</li>
                        </ul>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header">
                        <h5 class="card-title mb-0">已入库资料</h5>
                    </div>
                    <div class="card-body">
                        <div id="storedDocumentList" class="stored-document-list">正在读取数据库里的资料...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/document/document.js}"></script>
</div>
</body>
</html>
