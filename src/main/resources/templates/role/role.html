<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/css/role/role.css}" rel="stylesheet">
</head>
<body>
<div th:fragment="content">
    <div class="role-page">
        <!-- 各层区域由 JS 动态渲染：楼层式垂直分区 + 卡片网格 -->
        <div id="roleLayers">
            <div class="role-loading">正在加载角色集...</div>
        </div>
    </div>

    <!-- 卡片编辑弹层 -->
    <div class="role-modal-mask" id="roleModalMask" style="display: none;">
        <div class="role-modal">
            <h5 class="role-modal-title">编辑角色</h5>
            <input type="hidden" id="editRoleId">
            <div class="mb-3">
                <label class="form-label">头像（图片地址或表情符号）</label>
                <div class="role-avatar-row">
                    <input type="text" class="form-control role-avatar-input" id="editRoleAvatar" placeholder="例如 🐱 或 /images/cat.png">
                    <button type="button" class="role-avatar-upload-btn" title="从本地选择图片" onclick="pickAvatar()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             fill="currentColor" viewBox="0 0 16 16">
                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                            <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                        </svg>
                    </button>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
            </div>
            <div class="mb-3">
                <label class="form-label">名称</label>
                <input type="text" class="form-control" id="editRoleName" maxlength="20" placeholder="角色名称">
            </div>
            <div class="mb-3">
                <label class="form-label">描述</label>
                <textarea class="form-control" id="editRoleDesc" rows="3" maxlength="200" placeholder="角色描述"></textarea>
            </div>
            <div class="role-modal-actions">
                <button class="btn btn-outline-secondary" onclick="closeRoleModal()">取消</button>
                <button class="btn btn-primary" onclick="saveRoleEdit()">保存</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/role/role.js}"></script>
</div>
</body>
</html>
